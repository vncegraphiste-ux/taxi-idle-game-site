<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow,noarchive" />
<title>Modération Draw Something</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#111315;color:#f5f5f5}
*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:960px;margin:auto}header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:0 0 24px}
h1{font-size:clamp(23px,4vw,34px);margin:0}p{line-height:1.5}small,.muted{color:#a7abb0}button,input{font:inherit}button{border:0;border-radius:11px;padding:13px 18px;font-weight:700;cursor:pointer;min-height:46px}button:disabled{opacity:.4;cursor:not-allowed}
input{background:#25282b;color:white;border:1px solid #52575e;border-radius:10px;padding:14px;width:100%;margin:8px 0 15px}
.card{border:1px solid #3c4044;background:#1c1f22;border-radius:16px;padding:20px;margin:14px 0}.login{max-width:420px;margin:12vh auto}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1}.green{background:#3dc77f;color:#082d1c}.orange{background:#ffb954;color:#372200}.red{background:#ff5b69;color:#3c090f}.neutral{background:#373c41;color:white}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}.meta div{overflow-wrap:anywhere}.meta b{display:block;color:#a7abb0;font-size:12px;margin-bottom:4px}
pre{background:#111315;padding:12px;border-radius:10px;max-height:160px;overflow:auto;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.preview{width:100%;max-width:650px;height:auto;background:white;border-radius:10px;display:none;margin:12px 0}
#error{color:#ff8790}.topbutton{width:auto}.hidden{display:none!important}@media(max-width:600px){body{padding:14px}.meta{grid-template-columns:1fr}.row{flex-direction:column}}
</style>
</head>
<body><main>
<section id="login" class="card login">
  <h1>Modération Draw Something</h1><p class="muted">Accès réservé à l'administration.</p>
  <form id="loginForm"><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required /><button class="green" type="submit">Se connecter</button></form>
  <p id="loginError" role="alert"></p>
</section>
<section id="panel" class="hidden">
  <header><div><h1>Modération Draw Something</h1><p class="muted" id="count">Chargement…</p></div><button class="neutral topbutton" id="refresh">Actualiser</button></header>
  <div id="error" role="alert"></div><div id="reports"></div>
</section>
</main>
<script>
const $ = id => document.getElementById(id);
const escapeHtml = value => String(value ?? '—').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick = (data, names) => names.map(k => data?.[k]).find(v => v !== null && v !== undefined && v !== '') ?? null;
const label = (k, v) => `<div><b>${k}</b>${escapeHtml(v)}</div>`;
function extractSnapshot(value){if(!value)return null;try{return typeof value==='string'?JSON.parse(value):value}catch{return value}}
async function api(path, options={}){
 const r=await fetch(path,{credentials:'same-origin',cache:'no-store',...options});
 const data=await r.json().catch(()=>({error:'Réponse inattendue'}));
 if(!r.ok)throw new Error(data.error||'Erreur réseau');
 return data;
}
function showPanel(){ $('login').classList.add('hidden');$('panel').classList.remove('hidden'); }
function showLogin(){ $('panel').classList.add('hidden');$('login').classList.remove('hidden'); }
$('loginForm').addEventListener('submit', async e=>{
 e.preventDefault();$('loginError').textContent='';
 const button=e.submitter;button.disabled=true;
 try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});$('password').value='';showPanel();await loadReports();}
 catch(err){$('loginError').textContent=err.message}finally{button.disabled=false}
});
$('refresh').addEventListener('click',loadReports);
async function loadReports(){
 $('error').textContent='';$('reports').textContent='Chargement des signalements…';
 try{const {reports}=await api('/api/reports');showPanel();$('reports').replaceChildren();$('count').textContent=`${reports.length} signalement(s) en attente${reports.length===200?' (affichage limité à 200)':''}`;
 if(!reports.length){$('reports').textContent='Aucun signalement en attente 🎉';return;}
 for(const report of reports)renderReport(report);
 }catch(err){if(err.message==='Connexion requise'){showLogin();return;}$('reports').textContent='';$('error').textContent=err.message;}
}
function renderReport(r){
 const id=pick(r,['report_id','id']);
 const date=pick(r,['created_at','reported_at','date']);
 const info={
 'Date':date?new Date(date).toLocaleString('fr-CA'):null,
 'Joueur signalé':pick(r,['reported_username','reported_player_username','player_username','author_username']),
 'Signalé par':pick(r,['reporter_username','reporting_username']),
 'Catégorie':pick(r,['category','category_name']),
 'Commentaire':pick(r,['comment','reason','report_comment']),
 'Mot':pick(r,['word_snapshot','word'])};
 const card=document.createElement('article');card.className='card';
 const heading=document.createElement('h2');heading.textContent='Signalement';heading.style.marginTop='0';card.append(heading);
 const meta=document.createElement('div');meta.className='meta';meta.innerHTML=Object.entries(info).map(([k,v])=>label(k,v)).join('');card.append(meta);
 const snapshot=extractSnapshot(pick(r,['drawing_snapshot']));
 if(snapshot){
  const p=document.createElement('p');p.className='muted';p.textContent='Dessin disponible (snapshot JSON)';card.append(p);
  const pre=document.createElement('pre');pre.textContent=JSON.stringify(snapshot,null,2).slice(0,12000);card.append(pre);
 }else{const p=document.createElement('p');p.className='muted';p.textContent='Aucun aperçu enregistré dans cette vue.';card.append(p);}
 const buttons=document.createElement('div');buttons.className='row';
 for(const [action,text,color] of [['ok','OK','green'],['ban_10m','Bannir 10 min','orange'],['ban_forever','Ban définitif aléatoire','red']]){
  const button=document.createElement('button');button.className=color;button.textContent=text;button.disabled=!id;
  button.addEventListener('click',async()=>{
   if(!confirm(`Confirmer : ${text} ?`))return;
   [...buttons.children].forEach(b=>b.disabled=true);$('error').textContent='';
   try{await api('/api/moderate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reportId:id,action})});card.remove();await loadReports();}
   catch(err){$('error').textContent=err.message;[...buttons.children].forEach(b=>b.disabled=false)}
  });buttons.append(button);
 }
 card.append(buttons);$('reports').append(card);
}
// Vérifie au chargement si un cookie de session valide existe.
loadReports();
</script>
</body></html>
